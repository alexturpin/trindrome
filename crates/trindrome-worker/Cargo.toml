[package]
name = "trindrome-worker"
description = "Local resumable search worker and CLI for Trindrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "trindrome"
path = "src/main.rs"

# The same worker without a console window, for starting at login.
[[bin]]
name = "trindrome-agent"
path = "src/agent.rs"

[dependencies]
trindrome-core.workspace = true
trindrome-cpu.workspace = true
trindrome-cuda.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

nvml-wrapper.workspace = true
tracing-appender.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[dev-dependencies]
trindrome-cuda.workspace = true
tempfile.workspace = true

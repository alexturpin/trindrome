[workspace]
resolver = "3"
members = ["crates/trindrome-core", "crates/trindrome-cpu", "crates/trindrome-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
trindrome-core = { path = "crates/trindrome-core" }
trindrome-cpu = { path = "crates/trindrome-cpu" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
num-bigint = "0.5"
num-traits = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Big-integer arithmetic is painfully slow unoptimized; keep debug builds and
# tests usable without hiding our own code from the debugger.
[profile.dev.package.num-bigint]
opt-level = 3

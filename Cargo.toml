[workspace]
resolver = "3"
members = ["crates/trindrome-core", "crates/trindrome-cpu", "crates/trindrome-cuda", "crates/trindrome-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
trindrome-core = { path = "crates/trindrome-core" }
trindrome-cpu = { path = "crates/trindrome-cpu" }
trindrome-cuda = { path = "crates/trindrome-cuda" }
anyhow = "1"
cc = "1.2"
# Driver API only, loaded at run time so the binary works on machines without CUDA.
# `nvrtc` is needed only for cudarc's module-image type; NVRTC itself is never loaded.
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-13000"] }
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
nvml-wrapper = "0.13"
tracing-appender = "0.2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }
num-bigint = "0.5"
num-traits = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Big-integer arithmetic is painfully slow unoptimized; keep debug builds and
# tests usable without hiding our own code from the debugger.
[profile.dev.package.num-bigint]
opt-level = 3
